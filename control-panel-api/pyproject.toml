[project]
name = "control-panel-api"
version = "0.1.0"
description = "ModelGuide Control Panel API - FastAPI + FastMCP backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "fastmcp",
    "uvicorn",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_panel_api"]
