# Pipecat Cloud deployment configuration
# See: https://docs.pipecat.daily.co/pipecat-cloud/deployment

image: pipecat-modelguide-agent
entrypoint: src/bot.py

services:
  - daily
  - deepgram
  - openai
  - cartesia

env:
  - DAILY_API_KEY
  - OPENAI_API_KEY
  - DEEPGRAM_API_KEY
  - CARTESIA_API_KEY
  - CARTESIA_VOICE_ID
  - MODELGUIDE_API_URL
  - MODELGUIDE_API_KEY
  - MODELGUIDE_AGENT_ID
