[project]
name = "pipecat-modelguide-agent"
version = "0.25.1"
description = "Pipecat voice agent for ModelGuide (BuildPro Sam demo)"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[daily,openai,deepgram,elevenlabs,cartesia,silero,tracing]>=0.0.105",
    "pipecatcloud>=0.2.20",
    "opentelemetry-exporter-otlp-proto-http",
    "httpx",
    "python-dotenv",
    "mcp",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
