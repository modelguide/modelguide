name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make api-install
      - run: make api-lint-check
      - run: make api-typecheck
      - run: make api-test-unit
      - run: make api-test-integration
        timeout-minutes: 5

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modelguide-ui/package-lock.json
      - run: make ui-install
      - run: make ui-lint
      - run: make ui-typecheck
      - run: make ui-test
