name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint-typecheck:
    name: "API: Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make api-install
      - run: make api-lint-check
      - run: make api-typecheck

  api-unit-tests:
    name: "API: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make api-install
      - run: make api-test-unit

  api-integration-tests:
    name: "API: Integration Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make api-install
      - run: make api-test-integration
        timeout-minutes: 5

  ui-lint-typecheck:
    name: "UI: Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modelguide-ui/package-lock.json
      - run: make ui-install
      - run: make ui-lint
      - run: make ui-typecheck

  ui-unit-tests:
    name: "UI: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modelguide-ui/package-lock.json
      - run: make ui-install
      - run: make ui-test
