# Lefthook configuration for ModelGuide monorepo
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    api-lint:
      root: modelguide-api/
      glob: "*.{ts,tsx}"
      run: bun run lint:check

    ui-lint:
      root: modelguide-ui/
      glob: "*.{ts,tsx}"
      run: npm run lint

pre-push:
  parallel: true
  commands:
    api-typecheck:
      root: modelguide-api/
      glob: "*.{ts,tsx}"
      run: bun tsc --noEmit

    ui-typecheck:
      root: modelguide-ui/
      glob: "*.{ts,tsx}"
      run: npm run typecheck
