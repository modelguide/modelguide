# Lefthook configuration for ModelGuide monorepo
# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    ui-lint:
      root: modelguide-ui/
      run: npm run lint

pre-push:
  parallel: true
  commands:
    ui-typecheck:
      root: modelguide-ui/
      glob: "*.{ts,tsx}"
      run: npm run typecheck

    api-typecheck:
      root: modelguide-api/
      glob: "*.{ts,tsx}"
      run: bun tsc --noEmit
